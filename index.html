    <!-- Critical initial theme CSS to prevent any wrong-theme flash before stylesheet loads -->
    <style>
      html[data-theme="default"], html[data-theme="dark"] { background-color: #140c1e; color: #fdf2f4; color-scheme: dark; }
      html[data-theme="glass"] { background-color: #070312; color: #ffffff; color-scheme: dark; }
      html[data-theme="light"] { background-color: #fff5f8; color: #3a1226; color-scheme: light; }
      html:not(.theme-ready), html:not(.theme-ready) *, html:not(.theme-ready) *::before, html:not(.theme-ready) *::after {
        transition: none !important;
      }
    </style>

    <!-- Anti-flash inline script & Early PWA install prompt capture -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'default';
        try {
          var saved = localStorage.getItem('kashishTheme');
          if (saved === 'glass') {
            theme = 'glass';
          } else if (saved === 'light') {
            theme = 'light';
          } else {
            theme = 'default';
          }
        } catch (e) {
          theme = 'default';
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute(
            'content',
            theme === 'light' ? '#fff5f8' : theme === 'glass' ? '#070312' : '#140c1e'
          );
        }
        window.addEventListener('DOMContentLoaded', function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              root.classList.add('theme-ready');
            });
          });
        });

        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
        });

        window.addEventListener(
          'error',
          function (e) {
            if (e && e.message === 'Script error.' && !e.filename && !e.lineno) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
