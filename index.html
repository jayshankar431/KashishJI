<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kashishhh</title>
    <meta name="description" content="A deeply romantic, heart-touching interactive surprise gift world for Kashish, with games, puzzles, poems, memories, and secret letters." />
    <meta property="og:title" content="Kashishhh" />
    <meta property="og:description" content="A deeply romantic, heart-touching interactive surprise gift world for Kashish, with games, puzzles, poems, memories, and secret letters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Color scheme & theme color: Default dark theme #1a0d1f -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1a0d1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kashishhh" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Anti-flash inline script & Early PWA install prompt capture -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kashishTheme');
          if (saved === 'glass') {
            document.documentElement.setAttribute('data-theme', 'glass');
          } else if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'default');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'default');
        }

        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
        });
      })();
    </script>
    
    <!-- Preconnect & DNS-Prefetch for high-speed font and image streaming -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Preload key visual assets for 60fps instant rendering -->
    <link rel="preload" as="image" href="https://res.cloudinary.com/dsfcu9y1h/image/upload/v1790940725/Golden_Gaze_in_a_Neon_Circle_hztvx3.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/pwa-512x512.png" fetchpriority="high" />
    <link rel="preload" as="image" href="https://res.cloudinary.com/dsfcu9y1h/image/upload/v1791174014/Dreamy_Monochrome_Romance_with_Hearts_cie0p4.png" fetchpriority="high" />
    <link rel="preload" as="image" href="https://res.cloudinary.com/dsfcu9y1h/image/upload/v1791190420/Kashish_Silver_Calligraphy_with_Hearts_d0gbuz.png" fetchpriority="high" />
    <link rel="preload" href="/fonts/LucySaidOkPersonalUse.ttf" as="font" type="font/ttf" crossorigin />
    
    <!-- Google Fonts Link: Romantic & Playful Handwriting Fonts + Poppins (400,500,600,700) -->

    <link href="https://fonts.cdnfonts.com/css/my-sunshine" rel="stylesheet">
  </head>
