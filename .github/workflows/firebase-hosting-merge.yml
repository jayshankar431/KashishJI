name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate latest-apk.json release metadata
        run: |
          VERSION_CODE=$((300 + ${{ github.run_number }}))
          VERSION_NAME="3.0.${{ github.run_number }}"
          cat > public/latest-apk.json <<EOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "runNumber": ${{ github.run_number }},
            "commitSha": "${{ github.sha }}",
            "repo": "${{ github.repository }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/Kashishhh.apk",
            "githubReleaseApkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/Kashishhh.apk",
            "releasedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KASHISHJI }}'
          channelId: live
          projectId: kashishji


