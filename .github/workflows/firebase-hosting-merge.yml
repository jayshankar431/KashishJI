name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate latest-apk.json with matching commit count version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((2000 + COMMIT_COUNT))
          VERSION_NAME="3.1.${COMMIT_COUNT}"
          APK_FILE="Kashishhh-v${VERSION_NAME}.apk"
          cat <<EOF > public/latest-apk.json
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkName": "${APK_FILE}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/${APK_FILE}",
            "releasedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Build website
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KASHISHJI }}'
          channelId: live
          projectId: kashishji


