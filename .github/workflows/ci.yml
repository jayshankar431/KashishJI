name: CI (Web + Android APK Artifact)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  web:
    name: Web Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc)
        run: npm run lint

      - name: Production Vite build
        run: npm run build

  android:
    name: Build Android APK Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare google-services.json from GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e '
            const fs = require("fs");
            let raw = (process.env.GOOGLE_SERVICES_JSON || "").trim();
            if (!raw) {
              console.log("No GOOGLE_SERVICES_JSON secret provided; building without google-services plugin.");
              process.exit(0);
            }
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\x27") && raw.endsWith("\x27"))) {
              raw = raw.slice(1, -1).trim();
            }
            if (!raw.startsWith("{")) {
              try {
                const decoded = Buffer.from(raw, "base64").toString("utf8").trim();
                if (decoded.startsWith("{")) raw = decoded;
              } catch {}
            }
            try {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed.client) && parsed.client.length > 0) {
                const targetPkg = "com.kashish.world";
                const hasPkg = parsed.client.some(
                  (c) => c?.client_info?.android_client_info?.package_name === targetPkg
                );
                if (!hasPkg) {
                  const cloned = JSON.parse(JSON.stringify(parsed.client[0]));
                  cloned.client_info = cloned.client_info || {};
                  cloned.client_info.android_client_info = { package_name: targetPkg };
                  parsed.client.push(cloned);
                }
              }
              fs.writeFileSync("android-app/app/google-services.json", JSON.stringify(parsed, null, 2));
              console.log("Successfully wrote android-app/app/google-services.json");
            } catch (e) {
              console.warn("GOOGLE_SERVICES_JSON is not valid JSON; skipping file write:", e.message);
            }
          '

      - name: Build Debug APK
        run: |
          VERSION_CODE=$((300 + ${{ github.run_number }}))
          VERSION_NAME="3.0.${{ github.run_number }}"
          gradle :app:assembleDebug -PversionCodeProp="$VERSION_CODE" -PversionNameProp="$VERSION_NAME" --no-daemon --stacktrace

      - name: Upload APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: kashish-world-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct .apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="3.0.${{ github.run_number }}"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Kashishhh.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk KashishWorld.apk
          TAG_NAME="latest-apk"
          RELEASE_TITLE="Kashishhh APK v${VERSION_NAME} (Build #${{ github.run_number }})"
          RELEASE_NOTES="Automatic Android APK build **v${VERSION_NAME}** from commit ${{ github.sha }}.

          📱 **Direct 1-Click APK Download:** Neeche **Assets** me se **Kashishhh.apk** par click karke seedha mobile me download aur install karein (Unzip karne ki zaroorat nahi hai)."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "${{ github.sha }}"
          git push origin "$TAG_NAME" --force

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" Kashishhh.apk KashishWorld.apk android-app/app/build/outputs/apk/debug/app-debug.apk --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG_NAME" Kashishhh.apk KashishWorld.apk android-app/app/build/outputs/apk/debug/app-debug.apk --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          fi

          echo "### 📱 Direct Android APK Download (Bina Unzip Kiye) — v${VERSION_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Click Here to Download Kashishhh.apk Directly](https://github.com/${{ github.repository }}/releases/download/latest-apk/Kashishhh.apk)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Or open the **[GitHub Releases Page](https://github.com/${{ github.repository }}/releases/tag/latest-apk)**" >> $GITHUB_STEP_SUMMARY


