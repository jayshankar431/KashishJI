name: CI (Web + Android APK Artifact)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  web:
    name: Web Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc)
        run: npm run lint

      - name: Production Vite build
        run: npm run build

  android:
    name: Build Android APK Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare google-services.json from GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e '
            const fs = require("fs");
            let raw = (process.env.GOOGLE_SERVICES_JSON || "").trim();
            if (!raw) {
              console.log("No GOOGLE_SERVICES_JSON secret provided; building without google-services plugin.");
              process.exit(0);
            }
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\x27") && raw.endsWith("\x27"))) {
              raw = raw.slice(1, -1).trim();
            }
            if (!raw.startsWith("{")) {
              try {
                const decoded = Buffer.from(raw, "base64").toString("utf8").trim();
                if (decoded.startsWith("{")) raw = decoded;
              } catch {}
            }
            try {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed.client) && parsed.client.length > 0) {
                for (const targetPkg of ["com.kashishhh.app", "com.kashish.world"]) {
                  const hasPkg = parsed.client.some(
                    (c) => c?.client_info?.android_client_info?.package_name === targetPkg
                  );
                  if (!hasPkg) {
                    const cloned = JSON.parse(JSON.stringify(parsed.client[0]));
                    cloned.client_info = cloned.client_info || {};
                    cloned.client_info.android_client_info = { package_name: targetPkg };
                    parsed.client.push(cloned);
                  }
                }
              }
              fs.writeFileSync("android-app/app/google-services.json", JSON.stringify(parsed, null, 2));
              console.log("Successfully wrote android-app/app/google-services.json");
            } catch (e) {
              console.warn("GOOGLE_SERVICES_JSON is not valid JSON; skipping file write:", e.message);
            }
          '

      - name: Build Signed Release APK (Consistent Certificate)
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((2000 + COMMIT_COUNT))
          VERSION_NAME="3.1.${COMMIT_COUNT}"
          APK_FILE="Kashishhh-v${VERSION_NAME}.apk"
          gradle :app:assembleRelease -PversionCodeProp="$VERSION_CODE" -PversionNameProp="$VERSION_NAME" --no-daemon --stacktrace
          if [ -f "android-app/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android-app/app/build/outputs/apk/release/app-release.apk" "$APK_FILE"
          else
            gradle :app:assembleDebug -PversionCodeProp="$VERSION_CODE" -PversionNameProp="$VERSION_NAME" --no-daemon --stacktrace
            cp "android-app/app/build/outputs/apk/debug/app-debug.apk" "$APK_FILE"
          fi
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Upload Versioned APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Kashishhh-v${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Versioned APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest-apk"
          RELEASE_TITLE="Kashishhh APK v${VERSION_NAME} (versionCode: ${VERSION_CODE})"
          RELEASE_NOTES="Automatic Android APK build **v${VERSION_NAME}** (versionCode: ${VERSION_CODE}) from commit ${{ github.sha }}.

          📱 **Direct 1-Click APK Download:** Tap **${APK_FILE}** under **Assets** below to download and install directly on your phone."

          # Delete any previous 'latest-apk' release so old APKs are completely removed
          gh release delete "$TAG_NAME" --yes --cleanup-tag >/dev/null 2>&1 || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "${{ github.sha }}"
          git push origin "$TAG_NAME" --force

          gh release create "$TAG_NAME" "$APK_FILE" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest

          echo "### 📱 Direct Android APK Download — v${VERSION_NAME} (versionCode: ${VERSION_CODE})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Click Here to Download ${APK_FILE} Directly](https://github.com/${{ github.repository }}/releases/download/latest-apk/${APK_FILE})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Or open the **[GitHub Releases Page](https://github.com/${{ github.repository }}/releases/tag/latest-apk)**" >> $GITHUB_STEP_SUMMARY


